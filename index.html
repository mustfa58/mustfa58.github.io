<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0412;color:#fff;font-family:Tahoma,Arial,sans-serif}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;font-size:26px}
.art{display:block;width:100%;height:100%;pointer-events:none;user-select:none}
.launch{position:absolute;left:50.72%;top:53.35%;width:33.38%;height:12.04%;padding:0;border:0;border-radius:999px;background:transparent;cursor:pointer;outline:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit;color:#fff;transition:box-shadow .22s ease}
.launch:focus,.launch:hover{box-shadow:0 0 0 2px #ffd3e2,0 0 22px 6px #ff336fa6,0 0 54px 11px #ff2a7059,inset 0 0 26px #ffd2e559}

.surface{position:absolute;inset:-1px;display:none;border-radius:inherit;border:2px solid #ffadc2;background:linear-gradient(180deg,#ed4b6a 0%,#ac2041 26%,#6a102b 68%,#8b1938 100%);box-shadow:inset 0 2px 6px #ffb8c9,inset 0 -3px 8px #ff547a;overflow:hidden;pointer-events:none}
.launch.running .surface,.launch.done .surface{display:block}
.progress-content{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 8%;gap:.38em}
.progress-row{display:flex;align-items:center;justify-content:space-between;gap:.6em}
.phase{font-weight:bold;font-size:1em;text-shadow:0 2px 5px #3a0019}
.count{direction:ltr;white-space:nowrap;font-size:1.25em;font-weight:bold;font-variant-numeric:tabular-nums;color:#fff7fb}
.track{position:relative;display:block;height:.24em;min-height:2px;background:#26031980;border-radius:99px;overflow:hidden;box-shadow:0 1px 0 #ffabb933}
.fill{display:block;position:absolute;right:0;top:0;height:100%;width:0;background:linear-gradient(90deg,#ffb1cf,#fff6fc);border-radius:inherit;box-shadow:0 0 10px #ffdfef;transition:width .12s linear}
.success{display:none;height:100%;align-items:center;justify-content:center;gap:.65em}
.success-copy{display:flex;flex-direction:column;align-items:center;gap:.12em}
.success-copy strong{font-size:1.25em;line-height:1.3;color:#fff1b7;text-shadow:0 2px 6px #301500}
.success-copy span{font-size:.8em;letter-spacing:.08em;color:#ffda73;font-weight:bold}
.check{font-size:1.35em;color:#fff1b7;border:1px solid #eac35e;border-radius:50%;width:1.45em;height:1.45em;display:flex;align-items:center;justify-content:center;line-height:1}
.launch.done .surface{border-color:#ffe7a0;background:linear-gradient(160deg,#806022,#4b2d11 48%,#231408);box-shadow:inset 0 2px 7px #d8a647,0 0 30px #ffc65d60}
.launch.done{box-shadow:0 0 0 1px #ffe5a4,0 0 32px #edb74b88}
.launch.done .progress-content{display:none}.launch.done .success{display:flex}
.preview-note{position:fixed;top:12px;left:12px;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px);font-size:11px;line-height:1.7}
.preview-note span,.replay{padding:5px 10px;border:1px solid #b17bc344;border-radius:30px;background:#0f0518e6;color:#dfc8e9}
.replay{font:inherit;cursor:pointer}.replay:focus{outline:2px solid #ffb0ce;outline-offset:3px}.replay[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}.info-bar{position:fixed;top:8px;left:12px;right:12px;font-size:13px;display:flex;align-items:center;gap:8px;justify-content:center;z-index:4;color:#fff}.info-bar span,.info-bar button,#details-panel{background:#160821ed;border:1px solid #875398;border-radius:12px;padding:7px 12px}.info-bar button,#run-panel button{color:white;background:#5d215f;cursor:pointer}#details-panel{position:fixed;top:55px;right:14px;width:370px;max-width:90vw;font-size:13px;z-index:5;max-height:70vh;overflow:auto}#details-panel a{color:#ffd5ed}#details-panel select{padding:6px}#run-panel{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:86%;height:28vh;background:#10081dee;border:1px solid #81528f;border-radius:12px;overflow:hidden;z-index:3}#run-panel.expanded{height:70vh}#run-frame{width:100%;height:calc(100% - 30px);border:0}.run-head{height:30px;text-align:center;font-size:13px}.launch:disabled{cursor:wait}.launch.working .surface{display:block}.launch.working .track{display:none}.phase{font-size:.85em}button:focus{outline:2px solid #ffe6b4}
